name: Analista de Dados diário

# Roda os motores de custo, a IA redige o diagnóstico e envia por e-mail.
# Todo dia útil às 8h BRT (11:00 UTC). Reaproveita a esteira de e-mail existente
# (SMTP_*/RESEND) e a mesma ANTHROPIC_API_KEY do chat do agente.
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 11:00 UTC = 08:00 BRT, seg a sex
  workflow_dispatch:

jobs:
  analista:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gerar e enviar diagnóstico
        env:
          # IA (mesma chave do chat do agente)
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:     ${{ secrets.ANTHROPIC_MODEL }}
          # E-mail — SMTP (recomendado) ou Resend
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE:     ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        run: python scripts/analista_diario.py
