name: Enviar relatório por e-mail

# Envia o relatório consolidado de pendências (Resend). Semanal + manual.
on:
  schedule:
    # Segunda 09:45 UTC = 06:45 BRT — depois das pendências do dia (06:30)
    - cron: "45 9 * * 1"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Enviar relatório
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE:     ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
        run: python scripts/enviar_relatorio.py
