name: Atualizar cache InMeta

on:
  schedule:
    # 09:20 UTC = 06:20 BRT — depois do snapshot (09:10) e do Prevision (09:00)
    - cron: "20 9 * * *"
  workflow_dispatch:   # permite rodar manualmente (aba Actions e botao no app)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Sem isto o push falha com 403: o GITHUB_TOKEN nasce somente-leitura.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar inspecoes e diario do tempo
        env:
          INMETA_EMAIL:    ${{ secrets.INMETA_EMAIL }}
          INMETA_SENHA:    ${{ secrets.INMETA_SENHA }}
          INMETA_BASE_URL: ${{ secrets.INMETA_BASE_URL }}
        run: python scripts/refresh_inmeta.py

      - name: Commit e push do cache atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/inmeta_inspections_raw.json data/raw/inmeta_diario_raw.json

          if git diff --staged --quiet; then
            echo "Sem alteracoes no cache InMeta"
            exit 0
          fi

          git commit -m "chore: atualiza cache InMeta $(date +%Y-%m-%d) [skip ci]"

          # Se master avancou nesse intervalo, o push seria rejeitado. Rebaseia
          # e tenta de novo em vez de perder a coleta.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Cache InMeta publicado"
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — rebaseando sobre o remoto"
            git pull --rebase origin master || break
          done

          echo "::error::Nao foi possivel publicar o cache InMeta coletado"
          exit 1

      # Rede de seguranca: se o push falhar, o dado coletado nao se perde.
      - name: Guardar cache coletado como artefato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cache-inmeta-${{ github.run_number }}
          path: |
            data/raw/inmeta_inspections_raw.json
            data/raw/inmeta_diario_raw.json
          retention-days: 7
